[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocrforge-web"
version = "0.1.0"
description = "CultureCourse demo web API (FastAPI)."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.136.3,<0.137",
  "uvicorn[standard]>=0.49.0,<0.50",
  "python-multipart>=0.0.32,<0.0.33",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "pydantic-settings>=2",
  "pillow>=12.2.0,<13",
  "httpx>=0.27,<0.29",
  "playwright>=1.47,<2",
  "pyobjc-framework-Vision; sys_platform == 'darwin'",
  "pyobjc-framework-Quartz; sys_platform == 'darwin'",
]

[tool.setuptools.packages.find]
include = ["ocrforge_web*"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
ocrforge-web = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
python = "3.11.*"
pip = ">=26.1.2,<27"
