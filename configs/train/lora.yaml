enabled: true
strategy: lora
batch_size: 4
gradient_accumulation_steps: 2
max_steps: 1000
learning_rate: 1.0e-4
weight_decay: 0.0
max_grad_norm: 1.0
eval_every_steps: 0
eval_split: test
eval_limit: 20
save_every_steps: 500
save_final: true
checkpoint_dir: checkpoints
resume_from_checkpoint: null
plot_curve: true
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
